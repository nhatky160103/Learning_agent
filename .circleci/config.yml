version: 2.1

orbs:
  node: circleci/node@5.1.0
  python: circleci/python@2.1.1

commands:
  gcp-auth:
    steps:
      - run:
          name: Authenticate with GCP
          command: |
            echo $GCP_SERVICE_ACCOUNT_KEY | base64 -d | \
              gcloud auth activate-service-account --key-file=-
            gcloud config set project $GCP_PROJECT
            gcloud auth configure-docker --quiet

jobs:
  test-frontend:
    executor:
      name: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: frontend
      - run:
          name: Run Linting
          command: npm run lint
          working_directory: frontend

  test-backend:
    docker:
      - image: cimg/python:3.11
      - image: postgres:16-alpine
        environment:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
      - image: docker.elastic.co/elasticsearch/elasticsearch:9.3.1
        environment:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    environment:
      DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db
      ES_HOST: localhost
      ES_PORT: 9200
      ES_USERNAME: ""
      ES_PASSWORD: ""
      ES_CA_CERT: ""
      ES_INDEX_NAME: test_learning_documents
      TESTING: "1"
    steps:
      - checkout
      - run:
          name: Wait for Postgres & Elasticsearch
          command: |
            dockerize -wait tcp://localhost:5432 -timeout 30s
            echo "Waiting for Elasticsearch (max 60s)..."
            ES_READY=0
            for i in $(seq 1 30); do
              if curl -sf http://localhost:9200/_cluster/health > /dev/null 2>&1; then
                echo "Elasticsearch is ready!"
                ES_READY=1
                break
              fi
              echo "  attempt $i/30..."
              sleep 2
            done
            if [ $ES_READY -eq 0 ]; then
              echo "Warning: Elasticsearch not ready, continuing anyway..."
            fi
      - python/install-packages:
          pkg-manager: pip
          app-dir: backend
          pip-dependency-file: requirements-dev.txt
      - run:
          name: Run Tests
          command: |
            cd backend
            pytest -x -q --tb=short

  build-and-push-backend:
    docker:
      - image: google/cloud-sdk
    steps:
      - setup_remote_docker
      - checkout
      - gcp-auth 
      - run:
          name: Build Backend Image
          command: |
            docker build -t gcr.io/$GCP_PROJECT/learning-assistant-backend:$CIRCLE_SHA1 \
                        -t gcr.io/$GCP_PROJECT/learning-assistant-backend:latest \
                        backend/
      - run: 
          name: Push Backend Image
          command: |  
            docker push gcr.io/$GCP_PROJECT/learning-assistant-backend:$CIRCLE_SHA1
            docker push gcr.io/$GCP_PROJECT/learning-assistant-backend:latest
  build-and-push-frontend:
    docker:
      - image: google/cloud-sdk
    steps:
      - setup_remote_docker
      - checkout
      - gcp-auth 
      - run:
          name: Build Frontend Image
          command: |
            docker build \
              --target runner \
              --build-arg NEXT_PUBLIC_API_URL=$BACKEND_URL \
              -t gcr.io/$GCP_PROJECT/learning-assistant-frontend:$CIRCLE_SHA1 \
              -t gcr.io/$GCP_PROJECT/learning-assistant-frontend:latest \
              frontend/
      - run:
          name: Push Frontend Image
          command: |
            docker push gcr.io/$GCP_PROJECT/learning-assistant-frontend:$CIRCLE_SHA1
            docker push gcr.io/$GCP_PROJECT/learning-assistant-frontend:latest

  deploy:
    docker:
      - image: google/cloud-sdk
    steps:
      - gcp-auth
      - run:
          name: Deploy Backend to Cloud Run
          command: |
            gcloud run deploy learning-assistant-backend \
              --image gcr.io/$GCP_PROJECT/learning-assistant-backend:$CIRCLE_SHA1 \
              --platform managed \
              --region $GCP_REGION \
              --project $GCP_PROJECT
      - run:
          name: Deploy Frontend to Cloud Run
          command: |
            gcloud run deploy learning-assistant-frontend \
              --image gcr.io/$GCP_PROJECT/learning-assistant-frontend:$CIRCLE_SHA1 \
              --platform managed \
              --region $GCP_REGION \
              --project $GCP_PROJECT

workflows:
  build-test-deploy:
    jobs:
      - test-frontend
      - test-backend

      - build-and-push-backend:
          requires:
            - test-backend
          filters:
            branches:
              only: main

      - build-and-push-frontend:
          requires:
            - test-frontend
          filters:
            branches:
              only: main

      - deploy:
          requires:
            - build-and-push-backend
            - build-and-push-frontend
          filters:
            branches:
              only: main