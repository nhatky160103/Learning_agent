version: 2.1

orbs:
  node: circleci/node@5.1.0
  python: circleci/python@2.1.1
  docker: circleci/docker@3.0.1

jobs:
  test-frontend:
    executor:
      name: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: frontend
      - run:
          name: Run Linting
          command: npm run lint
          working_directory: frontend

  test-backend:
    docker:
      - image: cimg/python:3.11
      - image: postgres:16-alpine
        environment:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
      - image: chromadb/chroma:latest
        environment:
          IS_PERSISTENT: "FALSE"
    environment:
      DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db
      CHROMA_HOST: localhost
      CHROMA_PORT: 8000
    steps:
      - checkout
      - run:
          name: Wait for Postgres & ChromaDB
          command: |
            sudo apt-get update && sudo apt-get install -y postgresql-client
            until pg_isready -h localhost -U test_user; do sleep 1; done
            echo "Waiting for ChromaDB (max 60s)..."
            CHROMA_READY=0
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/api/v1/heartbeat > /dev/null 2>&1; then
                echo "ChromaDB is ready!"
                CHROMA_READY=1
                break
              fi
              echo "  attempt $i/30..."
              sleep 2
            done
            if [ $CHROMA_READY -eq 0 ]; then
              echo "Warning: ChromaDB not ready, continuing anyway..."
            fi
      - python/install-packages:
          pkg-manager: pip
          app-dir: backend
          pip-dependency-file: requirements.txt
      - run:
          name: Run Tests
          command: |
            cd backend
            pip install -r requirements-dev.txt
            pytest

  build-and-push-backend:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - checkout
      - docker/check:
          docker_username: DOCKER_LOGIN
          docker_password: DOCKER_PASSWORD
      - run:
          name: Build Backend Image
          command: |
            docker build -t $DOCKER_LOGIN/learning-assistant-backend:latest backend/
      - run:
          name: Push Backend Image
          command: |
            docker push $DOCKER_LOGIN/learning-assistant-backend:latest

  build-and-push-frontend:
    executor: docker/docker
    steps:
      - setup_remote_docker
      - checkout
      - docker/check:
          docker_username: DOCKER_LOGIN
          docker_password: DOCKER_PASSWORD
      - run:
          name: Build Frontend Image
          command: |
            docker build \
              --target runner \
              --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL \
              -t $DOCKER_LOGIN/learning-assistant-frontend:latest \
              frontend/
      - run:
          name: Push Frontend Image
          command: |
            docker push $DOCKER_LOGIN/learning-assistant-frontend:latest

  deploy:
    docker:
      - image: cimg/base:stable
    environment:
      RAILWAY_TOKEN: $RAILWAY_TOKEN
      RAILWAY_PROJECT_ID: $RAILWAY_PROJECT_ID
    steps:
      - checkout
      - run:
          name: Install Railway CLI
          command: |
            curl -fsSL https://railway.app/install.sh | sh
            export PATH="$HOME/.railway/bin:$PATH"
      - run:
          name: Deploy to Railway
          command: |
            export PATH="$HOME/.railway/bin:$PATH"
            # Trigger redeploy cho từng service (Railway sẽ pull image mới từ Docker Hub)
            railway redeploy --service backend --yes
            railway redeploy --service frontend --yes
            railway redeploy --service chromadb --yes

workflows:
  build-test-deploy:
    jobs:
      - test-frontend
      - test-backend

      - build-and-push-backend:
          requires:
            - test-backend
          filters:
            branches:
              only: main

      - build-and-push-frontend:
          requires:
            - test-frontend
          filters:
            branches:
              only: main

      - deploy:
          requires:
            - build-and-push-backend
            - build-and-push-frontend
          filters:
            branches:
              only: main