services:
  postgres:
    image: postgres:16-alpine
    container_name: learning_assistant_db
    environment:
      POSTGRES_USER: learning_user
      POSTGRES_PASSWORD: learning_pass
      POSTGRES_DB: learning_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_user -d learning_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learning_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.1
    container_name: learning_assistant_es
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=learning_es_pass
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:learning_es_pass http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - learning_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learning_assistant_backend
    ports:
      - "8001:8001"
    volumes:
      # Mount code for hot-reload in development
      - ./backend:/app
      - /app/__pycache__
      - uploads_data:/app/uploads
    environment:
      - DATABASE_URL=postgresql+asyncpg://learning_user:learning_pass@postgres:5432/learning_assistant
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_USERNAME=elastic
      - ES_PASSWORD=learning_es_pass
      - ES_CA_CERT=
      - ES_INDEX_NAME=learning_documents
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CORS_ORIGINS=["http://localhost:3000"]
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - learning_network
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps  # Use deps stage for development
    container_name: learning_assistant_frontend
    ports:
      - "3000:3000"
    volumes:
      # Mount code for hot-reload in development
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8001
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - learning_network
    command: npm run dev

volumes:
  postgres_data:
  es_data:
  uploads_data:

networks:
  learning_network:
    driver: bridge
